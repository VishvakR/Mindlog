# Profiles (PLAN 3, design.md): `dev` = one node + model service + Prometheus, Grafana, Jaeger;
# `chaos` = a 3-node Raft cluster (RESP 6381-6383) for scripts/chaos/*.sh; `cluster` = 3 nodes that
# also form the placement driver (RESP 6391-6393), `cluster-join` adds node 4 (RESP 6394) for
# scripts/load-and-rebalance.sh.
#   docker compose --profile dev run --rm mindlog superuser upsert you@example.com 'a long password' --data-dir /data
#   docker compose --profile dev up --build
# Dashboard http://localhost:8090/_/ · RESP localhost:6379 · Grafana http://localhost:3000 · Jaeger http://localhost:16686
name: mindlog

x-chaos-node: &chaos-node
  profiles: [chaos]
  build: .
  image: mindlog:dev
  command: ['-c', '/etc/mindlog/cluster.yaml']
  volumes:
    - ./deploy/chaos/cluster.yaml:/etc/mindlog/cluster.yaml:ro
  networks: [chaos]

x-cluster-node: &cluster-node
  profiles: [cluster]
  build: .
  image: mindlog:dev
  command: ['-c', '/etc/mindlog/cluster.yaml']
  volumes:
    - ./deploy/cluster/cluster.yaml:/etc/mindlog/cluster.yaml:ro
  networks: [cluster]

services:
  cluster-1:
    <<: *cluster-node
    environment: { MINDLOG_NODE__RAFT_ID: '1', MINDLOG_NODE__ID: cluster-1 }
    ports: ['6391:6379', '8101:8090']
  cluster-2:
    <<: *cluster-node
    environment: { MINDLOG_NODE__RAFT_ID: '2', MINDLOG_NODE__ID: cluster-2 }
    ports: ['6392:6379', '8102:8090']
  cluster-3:
    <<: *cluster-node
    environment: { MINDLOG_NODE__RAFT_ID: '3', MINDLOG_NODE__ID: cluster-3 }
    ports: ['6393:6379', '8103:8090']
  cluster-4:
    <<: *cluster-node
    profiles: [cluster-join]
    command: ['-c', '/etc/mindlog/join.yaml']
    volumes:
      - ./deploy/cluster/join.yaml:/etc/mindlog/join.yaml:ro
    environment: { MINDLOG_NODE__RAFT_ID: '4', MINDLOG_NODE__ID: cluster-4 }
    ports: ['6394:6379', '8104:8090']

  mindlog-1:
    <<: *chaos-node
    environment: { MINDLOG_NODE__RAFT_ID: '1', MINDLOG_NODE__ID: mindlog-1 }
    ports: ['6381:6379', '8091:8090']
  mindlog-2:
    <<: *chaos-node
    environment: { MINDLOG_NODE__RAFT_ID: '2', MINDLOG_NODE__ID: mindlog-2 }
    ports: ['6382:6379', '8092:8090']
  mindlog-3:
    <<: *chaos-node
    environment: { MINDLOG_NODE__RAFT_ID: '3', MINDLOG_NODE__ID: mindlog-3 }
    ports: ['6383:6379', '8093:8090']

  mindlog:
    profiles: [dev]
    build: .
    image: mindlog:dev
    environment:
      MINDLOG_OBSERVABILITY__TRACING__ENDPOINT: http://jaeger:4318
      MINDLOG_OBSERVABILITY__TRACING__SAMPLE_RATIO: '1'
      MINDLOG_MODELS__ENDPOINT: model-service:50051
    ports:
      - '6379:6379'
      - '8090:8090'
    volumes:
      - mindlog-data:/data
    depends_on:
      - jaeger
      - model-service

  model-service:
    profiles: [dev]
    build:
      context: python
      dockerfile: model_service/Dockerfile
    image: mindlog-model-service:dev

  prometheus:
    profiles: [dev]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9091:9090'

  grafana:
    profiles: [dev]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mindlog.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  jaeger:
    profiles: [dev]
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'

volumes:
  mindlog-data:

networks:
  chaos: {}
  cluster: {}
