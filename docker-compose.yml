# Profiles (PLAN 3, design.md): `dev` = one node + model service + Prometheus, Grafana, Jaeger.
#   docker compose --profile dev run --rm mindlog superuser upsert you@example.com 'a long password' --data-dir /data
#   docker compose --profile dev up --build
# Dashboard http://localhost:8090/_/ · RESP localhost:6379 · Grafana http://localhost:3000 · Jaeger http://localhost:16686
name: mindlog

services:
  mindlog:
    profiles: [dev]
    build: .
    image: mindlog:dev
    environment:
      MINDLOG_OBSERVABILITY__TRACING__ENDPOINT: http://jaeger:4318
      MINDLOG_OBSERVABILITY__TRACING__SAMPLE_RATIO: '1'
    ports:
      - '6379:6379'
      - '8090:8090'
    volumes:
      - mindlog-data:/data
    depends_on:
      - jaeger

  model-service:
    profiles: [dev]
    build:
      context: python
      dockerfile: model_service/Dockerfile
    image: mindlog-model-service:dev

  prometheus:
    profiles: [dev]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9091:9090'

  grafana:
    profiles: [dev]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mindlog.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  jaeger:
    profiles: [dev]
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'

volumes:
  mindlog-data:
