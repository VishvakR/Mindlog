<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos on Mindlog</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 34rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      input[type='text'],
      input[type='email'],
      input[type='password'] {
        flex: 1 1 10rem;
        padding: 0.5rem;
      }
      button {
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid #8884;
      }
      li span {
        flex: 1;
        overflow-wrap: anywhere;
      }
      li.done span {
        text-decoration: line-through;
        opacity: 0.6;
      }
      img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 4px;
      }
      [role='alert'] {
        color: #c33;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
