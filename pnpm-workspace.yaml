packages:
  - packages/*
  - web
  - examples/*

# Packages whose install scripts we never run: they ship prebuilt platform
# binaries, so their install/postinstall step is only a fallback.
ignoredBuiltDependencies:
  - '@bufbuild/buf'
  - classic-level
  - unrs-resolver

# madge declares typescript ^5 but only uses its parser API, which is
# unchanged in 6.0; the cycle check is covered by a manual fixture run.
peerDependencyRules:
  allowedVersions:
    madge>typescript: '6'

# Security overrides for transitive dependencies (pnpm audit).
overrides:
  # eslint-plugin-boundaries pins 4.7.9; 4.7.10 fixes GHSA-8r5x-fm3f-whwj,
  # GHSA-p8wg-vrv2-v86f and GHSA-xw65-4hp5-5hc7.
  handlebars: ^4.7.10
  # Patched releases of transitive dependencies (phase 10 audit), same major unless noted.
  '@hono/node-server@<2.1.6': ^2.1.6 # @modelcontextprotocol/node allows ^1.19.9 || ^2.1.3
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=4.0.0 <4.2.3: ^4.2.3
  minimatch@>=7.0.0 <11.0.1: ^11.0.1 # major bump; lint, typecheck and tests pass with it
  qs@>=6.7.0 <6.16.1: ^6.16.1
  systeminformation@<5.33.16: ^5.33.16
  undici@>=7.0.0 <7.30.1: ^7.30.1

auditConfig:
  ignoreGhsas:
    # braces (via eslint-plugin-boundaries > micromatch) has no patched
    # release. The DoS needs attacker-controlled glob patterns; here braces only
    # sees our own lint config, at lint time. Revisit when a fix ships.
    - GHSA-vfj7-8cjw-p6xm
    # zod 3 and deepmerge come with the shadcn CLI; web imports only its
    # tailwind.css at build time, so that code never runs in Mindlog nor ships in
    # the dashboard bundle. zod 3 has no patched release; deepmerge has none.
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-gcqx-w48m-w2h4
