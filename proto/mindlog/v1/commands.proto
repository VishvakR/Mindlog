syntax = "proto3";

package mindlog.v1;

import "mindlog/v1/cache.proto";
import "mindlog/v1/collections.proto";
import "mindlog/v1/common.proto";
import "mindlog/v1/jobs.proto";
import "mindlog/v1/kv.proto";
import "mindlog/v1/memory.proto";
import "mindlog/v1/pd.proto";
import "mindlog/v1/range.proto";
import "mindlog/v1/txn.proto";

// Envelope of every replicated command in a range's Raft log (PLAN 6.1,
// ADR-0003). Everything non-deterministic (ids, HLC, model outputs) is decided
// by the proposer and carried here, so apply() is a pure function of the log.
message Command {
  // Idempotency key: apply skips a command whose request_id it has seen.
  bytes request_id = 1;
  // Principal that issued the command, for audit and provenance.
  string principal = 2;
  // Proposer's HLC timestamp (Hlc.value packing); apply uses it instead of a clock.
  uint64 hlc = 3;
  // Memory branch the command targets; empty means "main".
  string branch = 4;
  // Tenant whose keyspace the command touches (CLAUDE.md rule 10).
  string tenant = 5;
  // Agent acting for `principal` with a delegated token (ADR-0035); empty otherwise.
  string actor = 6;

  // Bodies use field numbers 10-99 (PLAN 6.1): kv 10-13, memory 20-25,
  // branches 30-32, cache 40-41, collections 50-52, transactions 60-62,
  // jobs 70-72, ranges 80-82, admin 90. Unused numbers stay reserved until
  // their body lands, behind a cluster version (PLAN 19.5).
  oneof body {
    KvWrite kv_write = 10;
    KvBatch kv_batch = 11;
    Expire expire = 12;
    GcThreshold gc_threshold = 13;
    MemoryCommit memory_commit = 20;
    MemoryMaintain memory_maintain = 21;
    MemoryForget memory_forget = 22;
    MemoryRecallStats memory_recall_stats = 23;
    ConflictResolve conflict_resolve = 24;
    MemoryTrust memory_trust = 25;
    BranchCreate branch_create = 30;
    BranchMerge branch_merge = 31;
    BranchDrop branch_drop = 32;
    CacheSet cache_set = 40;
    CacheInvalidate cache_invalidate = 41;
    RecordWrite record_write = 50;
    SchemaChange schema_change = 51;
    TxnPrewrite txn_prewrite = 60;
    TxnCommit txn_commit = 61;
    TxnRollback txn_rollback = 62;
    TxnCheck txn_check = 63;
    JobLease job_lease = 71;
    JobComplete job_complete = 72;
    Split split = 80;
    Freeze freeze = 81;
    Merge merge = 82;
    PdAllocIds pd_alloc_ids = 90;
    PdPutNode pd_put_node = 91;
    PdPutRange pd_put_range = 92;
    PdRemoveRange pd_remove_range = 93;
    PdSetTso pd_set_tso = 94;
    PdSetVersion pd_set_version = 95;
    PdRecordOperator pd_record_operator = 96;
  }

  reserved 14 to 19;
  reserved 26 to 29;
  reserved 33 to 39;
  reserved 42 to 49;
  reserved 52 to 59;
  reserved 64 to 70;
  reserved 73 to 79;
  reserved 83 to 89;
  reserved 97 to 99;
}

// Removes MVCC versions older than `below_version` (keeping the newest one at or
// below it) and elements of dead collection generations, at most `limit`
// entries per command (ADR-0022, PLAN 10.2).
message GcThreshold {
  // Phase 1-3 meaning (a log index); unused since versions are timestamps (ADR-0027).
  uint64 below_index = 1 [deprecated = true];
  uint32 limit = 2;
  // MVCC versions (HLC timestamps) below this are collected.
  uint64 below_version = 3;
}

// Outcome of applying one command, stored under its request_id so a retried
// request gets the original result.
message CommandResult {
  oneof outcome {
    KvReply kv = 1;
    ErrorDetail error = 2;
    TxnOutcome txn = 3;
    MemoryOutcome memory = 4;
    JobOutcome job = 5;
    RecordOutcome record = 6;
  }
}
