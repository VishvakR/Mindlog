syntax = "proto3";

package mindlog.v1;

// Hybrid logical clock timestamp (PLAN 8.7): 48-bit physical milliseconds in
// the high bits and a 16-bit logical counter in the low bits of one uint64.
message Hlc {
  uint64 value = 1;
}

// Idempotency key carried by every write (PLAN 6.2). Client-supplied or a
// ULID generated by the proposer.
message RequestId {
  bytes value = 1;
}

// Wire form of a MindlogError (CLAUDE.md §9). Only public-safe data: internal
// causes stay in logs.
message ErrorDetail {
  // MindlogErrorCode name, e.g. "NOT_FOUND".
  string code = 1;
  // Human-readable, public-safe message.
  string message = 2;
  // Per-field validation messages, keyed by field path.
  map<string, string> fields = 3;
  // Whether the same request may succeed if retried.
  bool retryable = 4;
}
