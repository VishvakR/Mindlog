syntax = "proto3";

package mindlog.v1;

import "mindlog/v1/jobs.proto";

// Agent memory (PLAN 5.3-5.5, 12; ADR-0031, ADR-0032). Every value here was decided
// by the proposing leader, model outputs included, so apply only stores and indexes.

message MemoryLink {
  string to = 1;
  // related | supports | derived_from | supersedes | contradicts
  string relation = 2;
  float weight = 3;
}

message MemorySource {
  // user | agent | tool | web | document | system | consolidation
  string type = 1;
  string ref = 2;
  string principal = 3;
}

// Stored at m/(user, 'r', id). Append-only: forgetting sets expired_at.
message MemoryRecord {
  // ULID.
  string id = 1;
  string user = 2;
  string agent = 3;
  string session = 4;
  // episodic | semantic | procedural | working | theme | tool_trace
  string kind = 5;
  string text = 6;
  // Entity ids (type:normalized name), filled by apply from the mentions.
  repeated string entities = 7;
  repeated MemoryLink links = 8;
  MemorySource source = 9;
  // verified | normal | quarantined
  string trust = 10;
  float importance = 11;
  // Forgetting-curve stability S in days.
  float strength = 12;
  // HLC of the committing command (set by apply).
  uint64 created_at = 13;
  // HLC when it was forgotten or superseded; 0 while current.
  uint64 expired_at = 14;
  repeated string tags = 15;
  uint32 version = 16;
  // Model that computed the vector (PLAN 14.5).
  string embedding_model = 17;
  // Commit index in its range (set by apply).
  uint64 log_index = 18;
  string branch = 19;
  // World time (ms since the epoch) the fact became / stopped being true; 0 is open.
  uint64 valid_from = 20;
  uint64 valid_to = 21;
  uint32 recall_count = 22;
  uint64 last_recalled_at = 23;
  // Free-form JSON object.
  string meta_json = 24;
  // Why it was forgotten (audit).
  string forget_reason = 25;
  // BM25 terms and length as indexed, so forgetting removes exactly these postings.
  repeated TermCount terms = 26;
  uint32 term_length = 27;
}

// Stored at m/(user, 'v', id).
message MemoryVector {
  string model_id = 1;
  // float32 little-endian, L2-normalised.
  bytes vector = 2;
  // Copies of the record fields recall filters on, so the vector index needs no record reads.
  string kind = 3;
  string trust = 4;
  string agent = 5;
  string session = 6;
}

message TermCount {
  string term = 1;
  uint32 count = 2;
}

message EntityMention {
  string name = 1;
  string type = 2;
}

message NewMemory {
  MemoryRecord record = 1;
  // Empty when no embedder was available (degraded mode).
  bytes vector = 2;
  repeated EntityMention mentions = 3;
}

// A relation between two entities named by a fact.
message EntityEdge {
  string src_name = 1;
  string src_type = 2;
  string relation = 3;
  string dst_name = 4;
  string dst_type = 5;
  float weight = 6;
  // Memory stating it.
  string memory_id = 7;
}

message JobRef {
  string id = 1;
  uint32 attempt = 2;
}

// Command body 20: new memories of one user, applied atomically with their
// indexes, any jobs to enqueue, and optionally the completion of the job that
// produced them.
message MemoryCommit {
  string user = 1;
  repeated NewMemory memories = 2;
  repeated EntityEdge edges = 3;
  repeated JobSpec enqueue = 4;
  JobRef complete = 5;
  // Contradictions found before commit (ADR-0015); apply stores them and applies the policy.
  repeated MemoryConflict conflicts = 6;
  // Older facts whose validity ends because a new one replaces them over time.
  repeated Supersede supersede = 7;
}

// A contradiction between an existing memory (a) and a new one (b), stored at
// m/(user, 'k', id), and at m/(user, 'ko', id) while open (ADR-0015).
message MemoryConflict {
  string id = 1;
  string a = 2;
  string b = 3;
  // Contradiction probability of (a, b) and of (b, a); 0 when the label was not contradiction.
  float score_ab = 4;
  float score_ba = 5;
  // HLC of the command that raised it (set by apply).
  uint64 detected_at = 6;
  // open | resolved
  string status = 7;
  // quarantine_new | newest_wins | ask_human | prefer_verified
  string policy = 8;
  // ingest, or merge:<branch>
  string origin = 9;
  string model_id = 10;
  // a | b | both, once resolved.
  string keep = 11;
  string resolved_by = 12;
  uint64 resolved_at = 13;
}

message Supersede {
  string id = 1;
  // World time (ms) the older fact stops being true.
  uint64 valid_to = 2;
}

// Command body 24: resolve a conflict (MEM.RESOLVE). The loser's validity ends,
// the winner leaves quarantine; nothing is deleted.
message ConflictResolve {
  string user = 1;
  string id = 2;
  // a | b | both
  string keep = 3;
  // With keep = both: world time (ms) b replaced a; 0 keeps both current.
  uint64 valid_from = 4;
  // World time (ms) of the resolution, decided by the proposer.
  uint64 now_ms = 5;
}

// Command body 25: set the trust of memories (review of quarantined content, PLAN 13.4).
message MemoryTrust {
  string user = 1;
  repeated string ids = 2;
  // verified | normal | quarantined
  string trust = 3;
  string reason = 4;
}

// Command body 22: forget memories (append-only; the records stay for history).
message MemoryForget {
  string user = 1;
  repeated string ids = 2;
  string reason = 3;
  // Taint cascade (PLAN 13.4): also forget every memory with this source
  // reference and, transitively, every memory derived from those.
  string source_ref = 4;
  // Most memories the cascade may reach; past it the command fails.
  uint32 cascade_limit = 5;
}

// Stored at m/(user, 'e', type, normalized name).
message MemoryEntity {
  string name = 1;
  string type = 2;
  uint32 mention_count = 3;
  uint64 created_at = 4;
}

// Stored at m/(user, 'g', 'out' | 'in', src, relation, dst).
message MemoryEdge {
  float weight = 1;
  repeated string memories = 2;
  uint64 created_at = 3;
}

// Result of a MemoryCommit or MemoryForget.
message MemoryOutcome {
  repeated string ids = 1;
  uint32 count = 2;
}

// A memory branch of a user scope, stored at m/(user, 'B', name) (ADR-0013).
// Its own memory lives under m/(user, 'w', name, ...) in main's layout.
message MemoryBranch {
  string name = 1;
  // Log index and MVCC version (HLC) of the command that created it: the
  // branch reads main as of fork_version.
  uint64 fork_index = 2;
  uint64 fork_version = 3;
  string created_by = 4;
  // open | merged | dropped
  string status = 5;
  // HLC it was merged or dropped.
  uint64 closed_at = 6;
  // Memories written on the branch, bounded by max_writes so merge and drop fit one command.
  uint32 writes = 7;
  uint32 max_writes = 8;
}

// Command body 30: create a branch of a user scope at this command's version.
message BranchCreate {
  string user = 1;
  string name = 2;
  // Most memories the branch may hold.
  uint32 max_writes = 3;
}

// A branch memory the merge copies into main.
message BranchAdd {
  string id = 1;
  // Stored quarantined because it contradicts main (policy raise).
  bool quarantine = 2;
}

// The merged fields of a main memory the branch changed.
message RecordFields {
  string id = 1;
  bool expired = 2;
  string trust = 3;
  uint64 valid_to = 4;
}

// An entity edge with its merged weight and supporting memories (CRDT merge).
message EdgeWeight {
  string src = 1;
  string relation = 2;
  string dst = 3;
  float weight = 4;
  repeated string memories = 5;
}

// Command body 31: merge a branch into main as planned by the leader
// (@mindlog/branching). Apply refuses it if main moved since the plan.
message BranchMerge {
  string user = 1;
  string name = 2;
  // abort | raise | prefer_branch | prefer_main
  string policy = 3;
  // Main's generation the plan was made at.
  uint64 main_generation = 4;
  repeated BranchAdd adds = 5;
  repeated RecordFields records = 6;
  repeated EdgeWeight edges = 7;
  repeated MemoryConflict conflicts = 8;
  repeated Supersede supersede = 9;
  // Branch facts left out (prefer_main), for the merge result.
  repeated string rejected = 10;
}

// Command body 32: drop a branch and its memories.
message BranchDrop {
  string user = 1;
  string name = 2;
}
