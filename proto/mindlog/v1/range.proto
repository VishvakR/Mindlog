syntax = "proto3";

package mindlog.v1;

// Ranges: contiguous slices of the encoded keyspace, each its own Raft group
// (PLAN 8.1, ADR-0009, ADR-0028).

// Bumps on membership changes (conf_version) and on splits or merges (version).
message RangeEpoch {
  uint64 conf_version = 1;
  uint64 version = 2;
}

enum ReplicaRole {
  REPLICA_ROLE_UNSPECIFIED = 0;
  REPLICA_ROLE_VOTER = 1;
  REPLICA_ROLE_LEARNER = 2;
}

message ReplicaDescriptor {
  uint64 node_id = 1;
  // Raft id of this replica; allocated by PD and never reused (ADR-0028).
  uint64 replica_id = 2;
  ReplicaRole role = 3;
}

// The range covers encoded keys in [start_key, end_key); an empty end_key is
// +infinity. Node-local `$node` keys belong to no range.
message RangeDescriptor {
  uint64 range_id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
  RangeEpoch epoch = 4;
  repeated ReplicaDescriptor replicas = 5;
}

// Splits the applying range at `split_key` (ADR-0009). The left side keeps the
// range id; the right side becomes `new_range_id` with the same replicas. The
// leader measures both halves and embeds the sizes, so apply never scans.
message Split {
  bytes split_key = 1;
  uint64 new_range_id = 2;
  uint64 left_bytes = 3;
  uint64 right_bytes = 4;
}

// Freezes the applying range for a merge into `merge_into` (it then refuses
// every command but Freeze); 0 unfreezes it (ADR-0009).
message Freeze {
  uint64 merge_into = 1;
}

// Merges the frozen right-hand neighbour `right` into the applying range. Each
// replica applies it only once its local copy of `right` has applied
// `freeze_index` (ADR-0009).
message Merge {
  RangeDescriptor right = 1;
  uint64 freeze_index = 2;
  // Members of the right range when the merge was proposed. Apply compares these
  // with the left range's members instead of reading the right replica's own,
  // possibly lagging, membership, so every replica decides alike.
  repeated uint64 right_voters = 3;
  repeated uint64 right_learners = 4;
}
