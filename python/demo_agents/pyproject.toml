[project]
name = "mindlog-demo-agents"
version = "0.0.0"
description = "A scripted agent that remembers in one MCP session and recalls in the next (phase 5 demo)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
mindlog-demo = "demo_agents.__main__:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "demo_agents"
