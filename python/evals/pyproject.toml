[project]
name = "mindlog-evals"
version = "0.0.0"
description = "Retrieval evals for Mindlog's memory (LongMemEval, LoCoMo), recipe ablations, packing curves and cache false positives (phase 6)"
requires-python = ">=3.12"
dependencies = [
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evals"
