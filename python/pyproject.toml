# uv workspace for Mindlog's Python side: the model sidecar, generated protobuf
# code, the retrieval eval harness, and the SDK (PLAN 23.2). Run everything
# through uv: `uv sync`, `uv run pytest`, `uv run ruff check`, `uv run mypy`.
[project]
name = "mindlog-python"
version = "1.0.0"
license = "MIT"
description = "Mindlog Python workspace root"
requires-python = ">=3.12"
dependencies = [
    "mindlog[langgraph]",
    "mindlog-demo-agents",
    "mindlog-evals",
    "mindlog-model-service",
    "mindlog-proto",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "ruff>=0.17.0",
    "types-grpcio>=1.84.0.20260928",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model_service", "mindlog_proto", "demo_agents", "evals", "sdk"]

[tool.uv.sources]
mindlog-model-service = { workspace = true }
mindlog-proto = { workspace = true }
mindlog-demo-agents = { workspace = true }
mindlog-evals = { workspace = true }
mindlog = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by grpcio-tools (scripts/gen-proto.sh); never edited by hand.
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi", "**/*_pb2_grpc.py"]

[tool.ruff.lint]
# pycodestyle, Pyflakes, pyupgrade, bugbear, simplify, isort, Ruff-specific
select = ["E", "F", "UP", "B", "SIM", "I", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
    "integration: needs real models or services; excluded from the fast suite",
    "compat: runs a client library against a built mindlog-server (pnpm build)",
]

[[tool.mypy.overrides]]
# onnxruntime ships no type information.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# grpcio-tools generates untyped service stubs; treat them as Any.
module = ["mindlog.v1.models_pb2_grpc"]
follow_imports = "skip"
