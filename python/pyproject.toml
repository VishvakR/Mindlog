# uv workspace for Mindlog's Python side: the model sidecar, generated protobuf
# code, and (later) the SDK and eval harness (PLAN 23.2). Run everything
# through uv: `uv sync`, `uv run pytest`, `uv run ruff check`, `uv run mypy`.
[project]
name = "mindlog-python"
version = "0.0.0"
description = "Mindlog Python workspace root"
requires-python = ">=3.12"
dependencies = ["mindlog-model-service", "mindlog-proto"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model_service", "mindlog_proto"]

[tool.uv.sources]
mindlog-model-service = { workspace = true }
mindlog-proto = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by grpcio-tools (scripts/gen-proto.sh); never edited by hand.
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi"]

[tool.ruff.lint]
# pycodestyle, Pyflakes, pyupgrade, bugbear, simplify, isort, Ruff-specific
select = ["E", "F", "UP", "B", "SIM", "I", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["integration: needs real models or services; excluded from the fast suite"]
